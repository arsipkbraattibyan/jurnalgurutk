<style>
:root{--blue:#1e88e5;--blued:#1565c0;--navy:#243b7b;--yel:#fdb913;--pink:#ee4f9a;--grn:#7cc243;--ink:#2b3a67;--mut:#6c7aa5;--ln:#cfe6fa;--sh:0 8px 24px #1e88e51f}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;font:15px/1.5 'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(#dff1ff,#f3faff 360px,#eaf6ff) fixed}

button{font:inherit;cursor:pointer}h1,h2,h3,p{margin:0}
.sub{color:var(--mut);font-weight:700}

.brand{display:flex;align-items:center;gap:10px}.brand .st{font-size:30px}.brand b{display:block;font-size:21px;color:var(--blued);line-height:1.1}.brand small{color:var(--mut);font-size:11px;letter-spacing:.6px}

.page{max-width:1180px;margin:0 auto;padding:6px 20px 30px}

.btn.rd{background:#fde4ee;color:#c2185b;box-shadow:none}.btn.gh{background:#e8f3fd;color:var(--blued);box-shadow:none}
.btn.s{padding:6px 16px;font-size:13px}.btn:disabled{opacity:.6}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;margin:8px 0 22px}

.scene .e{position:absolute;line-height:1;z-index:2}
.e1{font-size:86px;right:14%;bottom:62px}.e2{font-size:64px;left:8%;bottom:56px}.e3{font-size:76px;left:30%;bottom:34px}.e4{font-size:58px;right:6%;bottom:28px}.e5{font-size:30px;left:10%;top:16px}.e6{font-size:50px;right:34%;top:14px}.e7{font-size:28px;right:8%;top:30px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;background:#fff;border-radius:26px;padding:14px;box-shadow:var(--sh);margin-bottom:26px}

.row{border-left:8px solid var(--blue)}.row small{color:var(--mut);font-weight:700}.row h3{margin:0 0 4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 16px;margin:8px 0 12px}.kv small{display:block;font-size:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.fd label{display:block;font-weight:800;font-size:13px;color:var(--navy);margin-bottom:5px}.fd.full{grid-column:1/-1}
.frw{grid-column:1/-1;display:grid;gap:16px;align-items:start}.frw.f2{grid-template-columns:repeat(2,minmax(0,1fr))}.frw.f3{grid-template-columns:repeat(3,minmax(0,1fr))}.frw.f4{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.frw.f4 .ah{font-size:13px;padding:8px}.frw.f4 .ah span{min-width:0}
.frw>.fd.full{grid-column:auto;min-width:0}.frw .ah{padding:8px 10px;gap:6px}.frw .ah i{max-width:50%}

input:not([type=radio]):not([type=hidden]),textarea{width:100%;font:inherit;height:48px;padding:0 14px;border:2px solid var(--ln);border-radius:14px;background:#fff;color:var(--ink)}

.kh .op[data-i="2"] input:checked+span,.nl .op[data-i="2"] input:checked+span{background:#4a9be6;border-color:#4a9be6;box-shadow:0 3px 0 #2f7cc4}
.kh .op[data-i="3"] input:checked+span,.nl .op[data-i="0"] input:checked+span{background:#ee6c85;border-color:#ee6c85;box-shadow:0 3px 0 #cc4c66}

.lg{height:100vh;height:100dvh;display:grid;place-items:center;padding:10px;position:relative;overflow:hidden;background:linear-gradient(#8fd0ff,#cfeaff 55%,#eaf6ff)}

let ac;
function bunyi(t='klik'){if(!SET.suara)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
const f={klik:[620],ok:[520,780],err:[240,180],pin:[880]}[t];
f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+i*.09;o.frequency.value=hz;o.connect(g);g.connect(ac.destination);
g.gain.setValueAtTime({1:.05,2:.12,3:.25}[SET.vol],s);g.gain.exponentialRampToValueAtTime(.001,s+.1);o.start(s);o.stop(s+.11)})}catch(e){}}
// suara ucapan (bahasa Indonesia) lewat speechSynthesis peramban; mengikuti pengaturan Suara dan Volume
function ucap(t){if(!SET.suara)return;try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';
const v=(s.getVoices()||[]).find(x=>/^id([-_]|$)/i.test(x.lang));if(v)u.voice=v;u.volume={1:.45,2:.75,3:1}[SET.vol]||.75;u.rate=1;setTimeout(()=>s.speak(u),250)}catch(e){}}

/* ---------- API ---------- */
async function api(action,p={}){
const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,token:S.token,...p})});
const j=await r.json();
if(!j.ok){if(j.auth)keluar();throw new Error(j.error||'Terjadi kesalahan')}
if(j.sv!==undefined)svCek(j.sv);
return j}
/* versi sumber data: jika admin mengganti sumber, cache siswa / data siswa / presensi di perangkat ini dibuang otomatis */
function svBersih(){SISWA=null;try{cSet('siswa',null);Object.keys(localStorage).filter(x=>x.indexOf(CK())===0&&/^(ds_|pr_)/.test(x.slice(CK().length))).forEach(x=>localStorage.removeItem(x))}catch(e){}}
function svCek(v){try{const k='jgsv_'+((S.guru&&S.guru.id)||''),o=localStorage.getItem(k);if(o===String(v))return;localStorage.setItem(k,String(v));if(o!==null)svBersih()}catch(e){}}
/* ---------- cache lokal: tampil cepat dari data terakhir, lalu disegarkan di latar ---------- */
const CK=()=>'jgc_'+((S.guru&&S.guru.id)||'')+'_';
function cGet(k){try{const x=JSON.parse(localStorage.getItem(CK()+k)||'null');return x?x.d:null}catch(e){return null}}
function cSet(k,d){try{localStorage.setItem(CK()+k,JSON.stringify({d:d,t:Date.now()}))}catch(e){try{Object.keys(localStorage).filter(x=>x.indexOf('jgc_')===0).forEach(x=>localStorage.removeItem(x))}catch(e2){}}}
function cHapusSemua(){try{Object.keys(localStorage).filter(x=>x.indexOf('jgc_')===0).forEach(x=>localStorage.removeItem(x))}catch(e){}}
function cRows(k){const c=cGet('semua')||{};c[k]=ROWS[k]||[];cSet('semua',c)}
function stale(k){KBDT=0;delete ROWS[k];const c=cGet('semua');if(c){delete c[k];cSet('semua',c)}}

/* ---------- dialog konfirmasi di dalam aplikasi (pengganti popup bawaan browser) ---------- */
function tanya(judul,pesan,ya,bahaya){return new Promise(ok=>{const md=document.createElement('div');md.className='md';md.style.zIndex=40;
md.innerHTML=`<div class="sheet" style="max-width:420px"><h2>${esc(judul)}</h2><p class="sub" style="margin-bottom:6px;color:var(--ink)">${esc(pesan)}</p><div class="act"><button class="btn gh" data-n>Batal</button><button class="btn ${bahaya===false?'y':'rd'}" data-y>${esc(ya||'Ya')}</button></div></div>`;
const t=x=>{md.remove();ok(x)};md.onclick=e=>{if(e.target===md)return t(false);if(e.target.closest('[data-n]'))return t(false);if(e.target.closest('[data-y]'))t(true)};
document.body.appendChild(md);const b=md.querySelector('[data-n]');if(b)b.focus()})}
const urut=a=>a.sort((x,y)=>String(y.tanggal).localeCompare(String(x.tanggal)));
function cacheSemua(){const c=cGet('semua');if(!c||KEYS.some(k=>!Array.isArray(c[k])))return false;KEYS.forEach(k=>ROWS[k]=urut(c[k].slice()));return true}
async function muatSemua(){
let d;
try{const j=await api('semua');d=j.data}
catch(e){if(!/tidak dikenal/i.test(e.message))throw e;
const r=await Promise.all(KEYS.map(k=>api('list',{jenis:k})));d={};KEYS.forEach((k,i)=>d[k]=r[i].rows)}
cSet('semua',d);KEYS.forEach(k=>ROWS[k]=urut((d[k]||[]).slice()))}

/* ---------- foto (diisi admin lewat kolom foto di sheet Guru, boleh kosong) ---------- */
function fu(u){if(!u)return'';const m=String(u).match(/(?:\/d\/|[?&]id=)([-\w]{20,})/);return m&&!/thumbnail/.test(u)?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w300':u}
function av(foto,nama){const i=esc((nama||'?').trim().charAt(0).toUpperCase()).replace(/'/g,'');
return foto?`<img class="av" src="${esc(fu(foto))}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;av&quot;>${i}</span>'">`:`<span class="av">${i}</span>`}

const opts=(name,o,sel)=>`<div class="opts">${o.map(x=>`<label class="op"><input type="radio" name="r_${name}" value="${esc(x)}"${String(x)===String(sel)?' checked':''}><span>${esc(x)}</span></label>`).join('')}</div>`;
function fld(f,v){v=String(v??'');const L=`<label>${f.l}</label>`;
if(f.t==='txa')return`<div class="fd full">${L}<textarea name="${f.k}" rows="3" maxlength="1000" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></div>`;if(f.t==='tuj')return`<div class="fd full">${L}<textarea name="${f.k}" rows="2" maxlength="500" placeholder="Contoh: Anak mampu mengenal kebutuhan tubuh dan merawatnya">${esc(v)}</textarea></div>`;
if(f.t==='ind')return`<details class="fd full" id="indb"><summary class="ah kosong"><span>🎯 ${f.l}</span><i>Belum dipilih</i><em>›</em></summary><input type="hidden" name="${f.k}" value="${esc(v)}"><p class="sub" id="indh" style="font-size:12px;margin:-2px 0 8px"></p><div class="opts" id="indl"></div><div class="fup" style="margin-top:10px"><input id="indx" maxlength="200" placeholder="Tulis indikator sendiri sesuai tujuan pembelajaran" style="flex:1 1 220px;width:auto" autocomplete="off"><button type="button" class="btn o s" data-ia>+ Tambah</button></div></details>`;
if(f.t==='pc')return`<details class="fd full" id="pcb"><summary class="ah kosong"><span>💗 ${f.l}</span><i>Belum dipilih</i><em>›</em></summary><input type="hidden" name="${f.k}" value="${esc(v)}"><p class="sub" style="font-size:12px;margin:-2px 0 8px">${esc(f.ph||'Panca Cinta melengkapi, bukan pengganti, elemen CP. Pilih nilai yang tampak atau relevan pada pengamatan ini (boleh lebih dari satu).')}</p><div class="opts" id="pcl">${KBCN0.map(([id,n])=>`<label class="op"><input type="checkbox" name="pcc" value="${id}"><span>${esc(n)}</span></label>`).join('')}</div></details>`;
if(f.t==='date'){const dv=v||hari();return`<div class="fd">${L}<div class="dtw"><input type="date" name="${f.k}" value="${esc(dv)}"><span class="dv">${esc(tgl(dv))}</span></div></div>`}
if(f.t==='txt')return`<div class="fd">${L}<input name="${f.k}" value="${esc(v)}" autocomplete="off"></div>`;
if(f.t==='tgl')return`<div class="fd">${L}<input type="date" name="${f.k}" value="${esc(v)}"></div>`;
if(f.t==='tel')return`<div class="fd">${L}<input type="tel" inputmode="tel" name="${f.k}" value="${esc(v)}" autocomplete="off" placeholder="08xxxxxxxxxx"></div>`;
if(f.t==='eml')return`<div class="fd">${L}<input type="email" inputmode="email" name="${f.k}" value="${esc(v)}" autocomplete="off" placeholder="nama@email.com"></div>`;
if(f.t==='alm')return`<div class="fd full">${L}<textarea name="${f.k}" rows="3" placeholder="${esc(f.ph||'Jalan, RT/RW, kelurahan, kecamatan, kota')}">${esc(v)}</textarea></div>`;
if(f.t==='sel'){
if(f.o.every(x=>/^\d+$/.test(x))){const val=v!==''?v:(f.o[0]==='0'?'0':'');
return`<div class="fd">${L}<div class="stp"><button type="button" data-st="-1" aria-label="Kurangi">−</button><input type="number" inputmode="numeric" name="${f.k}" min="${f.o[0]}" max="${f.o[f.o.length-1]}" value="${esc(val)}"><button type="button" data-st="1" aria-label="Tambah">+</button></div></div>`}
const o=!v||f.o.includes(v)?f.o:[...f.o,v];
return`<div class="fd full" data-m="sel">${L}<input type="hidden" name="${f.k}" value="${esc(v)}">${opts(f.k,o,v)}</div>`}
if(f.t==='combo'){
if(!f.o.length)return`<div class="fd">${L}<input name="${f.k}" value="${esc(v)}" list="dl_${f.k}" autocomplete="off"><datalist id="dl_${f.k}"></datalist></div>`;
const hit=f.o.includes(v);
return`<div class="fd full" data-m="combo">${L}<input type="hidden" name="${f.k}" value="${esc(v)}">${opts(f.k,f.o,hit?v:'')}<input class="ex" placeholder="Atau ketik sendiri" value="${hit?'':esc(v)}"></div>`}
const o=f.o.find(x=>v===x||v.startsWith(x+'. ')),ex=o?v.slice(o.length).replace(/^\. /,''):v;
return`<div class="fd full" data-m="area">${L}<input type="hidden" name="${f.k}" value="${esc(v)}">${opts(f.k,f.o,o||'')}<textarea class="ex" placeholder="Catatan tambahan (boleh dikosongkan)">${esc(ex)}</textarea></div>`}
function syncOpt(fd){const h=fd.querySelector('input[type=hidden]'),m=fd.dataset.m,r=fd.querySelector('input[type=radio]:checked'),x=(fd.querySelector('.ex')||{value:''}).value.trim(),old=h.value;
h.value=m==='sel'?(r?r.value:''):m==='combo'?(x||(r?r.value:'')):[r&&r.value,x].filter(Boolean).join('. ');
if(h.value!==old)h.dispatchEvent(new Event('change',{bubbles:true}))}
function pilih(root,n,v){const h=root.querySelector(`input[type=hidden][name=${n}]`);if(!h)return;const fd=h.closest('.fd');fd.querySelectorAll('input[type=radio]').forEach(r=>r.checked=r.value===v);syncOpt(fd)}
function stepClick(e){const st=e.target.closest('[data-st]');if(!st)return false;const i=st.parentNode.querySelector('input'),mn=+i.min,mx=+i.max;i.value=Math.min(mx,Math.max(mn,(+i.value||0)+ +st.dataset.st));return true}
function ambil(root,fields){const d={};let kurang=null,kk=null;
fields.forEach(f=>{const e=root.querySelector(`[name=${f.k}]`);const v=e.value.trim();d[f.k]=v;if(!v&&(f.t!=='area'||f.k==='tindak')&&!f.opt&&!kurang){kurang=f.l;kk=f.k}});
return{d,kurang,kk}}

async function kecil(file,mx,persegi){if(!/^image\//.test(file.type))throw new Error('bukan gambar');
const url=URL.createObjectURL(file);
try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('bukan gambar'));i.src=url});
let last='';for(const[m,q]of[[mx,.72],[Math.round(mx*.85),.6],[Math.round(mx*.7),.5],[Math.round(mx*.55),.42]]){
let sx=0,sy=0,sw=im.naturalWidth,sh=im.naturalHeight;
if(persegi){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s}
const sc=Math.min(1,m/Math.max(sw,sh)),cw=Math.round(sw*sc),ch=Math.round(sh*sc);
const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
const d=c.toDataURL('image/jpeg',q);last=d;if(d.length<220000)return d} // target sekitar 160 KB per foto
if(last.length<390000)return last;
throw new Error('Foto terlalu besar')}
finally{URL.revokeObjectURL(url)}}

function ddModern(U){

const sync=()=>{const o=U.options[U.selectedIndex];t.textContent=o?o.text:'';b.disabled=U.disabled;b.classList.toggle('ph',!U.value);

const tandai=()=>{[...l.children].forEach((li,i)=>li.classList.toggle('hl',i===ix));const li=l.children[ix];if(li&&li.scrollIntoView)li.scrollIntoView({block:'nearest'})};
const buka=()=>{if(b.disabled||!opts().length)return;l.hidden=false;w.classList.add('open');b.setAttribute('aria-expanded','true');ix=Math.max(0,opts().findIndex(o=>o.value===U.value));tandai()};

else if((e.key==='Enter'||e.key===' ')&&!l.hidden){e.preventDefault();const o=opts()[ix];if(o)pilih(o.value)}

else if(e.key==='Tab')tutup()};
const luar=e=>{if(!document.body.contains(w)){document.removeEventListener('pointerdown',luar);return}if(!w.contains(e.target))tutup()};

const t=x=>{md.remove();ok(x)};md.onclick=e=>{if(e.target===md)return t('');if(e.target.closest('[data-n]'))return t('');const b=e.target.closest('[data-kt]');if(b)t(b.dataset.kt)};
document.body.appendChild(md)})}
const _js={};
const loadJs=u=>_js[u]||(_js[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>{delete _js[u];no(new Error('Gagal memuat pustaka PDF/gambar. Periksa koneksi internet.'))};document.head.appendChild(s)}));
const libs=()=>Promise.all([loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);

// render laporan menjadi kanvas per halaman, dipotong di batas baris tabel agar teks tidak terpotong
async function halaman(u){const src=$('#lap .paper');if(!src)throw new Error('Laporan belum siap dimuat.');
await libs();await siapFoto();
const W=Math.round(u.w*MM),H=Math.round(u.h*MM),mg=Math.round(MG*MM),use=H-2*mg;
const box=document.createElement('div');box.id='capbox';box.className='cap';
box.style.cssText=`position:absolute;left:-99999px;top:0;width:${W}px;padding:0 ${mg}px;background:#fff;box-sizing:border-box`;
box.appendChild(src.cloneNode(true));document.body.appendChild(box);
try{const top=box.getBoundingClientRect().top,pts=new Set();
box.querySelectorAll('tr,p,.ttd,.kop,figure').forEach(e=>{if(!e.closest('thead'))pts.add(Math.round(e.getBoundingClientRect().bottom-top))});
box.querySelectorAll('h3,h4').forEach(e=>pts.add(Math.round(e.getBoundingClientRect().top-top)));
const total=Math.ceil(box.getBoundingClientRect().height),sorted=[...pts].sort((a,b)=>a-b);
const cv=await html2canvas(box,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:W,onclone:d=>{const b=d.getElementById('capbox');if(b)b.style.left='0'}});
const k=cv.width/W,pages=[];let y=0;
while(y<total-1){let cut=Math.min(y+use,total);
if(total-y>use){const c=sorted.filter(p=>p>y+use*.35&&p<=y+use);if(c.length)cut=c[c.length-1]}
pages.push([y,cut]);y=cut}
return pages.map(([a,b])=>{const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);
const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
const sy=Math.round(a*k),sh=Math.min(Math.round((b-a)*k),cv.height-sy);
x.drawImage(cv,0,sy,cv.width,sh,0,Math.round(mg*k),cv.width,sh);return c})}
finally{box.remove()}}
const unduh=(href,nama)=>{const a=document.createElement('a');a.href=href;a.download=nama;document.body.appendChild(a);a.click();a.remove()};
/* ---------- simpan Excel (.xlsx) dan Word (.docx), dibuat langsung di peramban ---------- */
const XLS_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',ZIP_URL='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const selTeks=t=>String(t==null?'':t).replace(/\s+/g,' ').trim();
const selNilai=t=>{t=selTeks(t);return /^(-?[1-9]\d{0,8}|0)$/.test(t)?+t:t};
function tabelAoa(t){const out=[];[...t.querySelectorAll('tr')].filter(r=>r.closest('table')===t).forEach(r=>{const row=[];[...r.children].forEach(c=>{row.push(selNilai(c.textContent));for(let k=1;k<(c.colSpan||1);k++)row.push('')});out.push(row)});return out}
async function simpanExcel(nama){const src=$('#lap .paper');if(!src)throw new Error('Laporan belum siap dimuat.');
if(S.view!=='identitas')return simpanExcelLap(src,nama);
await loadJs(XLS_URL);const wb=XLSX.utils.book_new(),pakai=new Set();
const lebar=a=>{const n=a.reduce((m,r)=>Math.max(m,r.length),0),w=Array(n).fill(8);a.forEach(r=>r.forEach((v,i)=>{w[i]=Math.min(60,Math.max(w[i],String(v).length+2))}));return w.map(x=>({wch:x}))};
const els=[...src.querySelectorAll('h3,h4,table')];
if(S.view==='identitas'){const aoa=[];els.forEach(e=>{if(e.tagName==='H3'){if(aoa.length)aoa.push([]);aoa.push([selTeks(e.textContent)])}else if(e.tagName==='TABLE')tabelAoa(e).forEach(r=>aoa.push(r))});
if(!aoa.length)throw new Error('Tidak ada data untuk disimpan.');const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=lebar(aoa);XLSX.utils.book_append_sheet(wb,ws,'Data')}
XLSX.writeFile(wb,nama+'.xlsx')}

async function simpanExcelLap(src,nama){await loadJs(ZIP_URL);

const cellTeks=c=>{const k=c.cloneNode(true);k.querySelectorAll('img,svg,script,style').forEach(x=>x.remove());return tx(k.innerHTML)};
const ncOf=t=>{let m=0;[...t.querySelectorAll('tr')].filter(r=>r.closest('table')===t).forEach(r=>{m=Math.max(m,[...r.children].reduce((a,c)=>a+(c.colSpan||1),0))});return m};
let G=13;src.querySelectorAll('table').forEach(t=>{if(!t.closest('.idgrid'))G=Math.max(G,ncOf(t))});

const num=t=>/^(-?[1-9]\d{0,8}|0)$/.test(t)?+t:t;
const tabel=t=>{const trs=[...t.querySelectorAll('tr')].filter(r=>r.closest('table')===t);if(!trs.length)return;

trs.forEach(r=>{let i=0;[...r.children].forEach(c=>{const sp=c.colSpan||1;if(sp===1)wt[i]=Math.max(wt[i],Math.min(36,Math.max.apply(null,cellTeks(c).split('\n').map(x=>x.length).concat([1]))));i+=sp})});

function spark(a){if(!a.length)return'';const W=110,H=30,p=5,x=i=>a.length===1?W/2:p+i*(W-2*p)/(a.length-1),y=v=>H-p-v*(H-2*p)/3;
return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="vertical-align:middle"><polyline fill="none" stroke="#9db4d6" stroke-width="2" points="${a.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>${a.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${LVC[v]}"/>`).join('')}</svg>`}
const tren=p=>p.n<2?'-':p.last>p.first?'<b style="color:#2e7d32">▲ Naik</b>':p.last<p.first?'<b style="color:#c2185b">▼ Turun</b>':'▬ Tetap';
function narasi(nama,per){if(!per.length)return'';

const baik=per.filter(p=>p.last>=2).map(p=>p.aspek.toLowerCase()),perlu=per.filter(p=>p.last<2).map(p=>p.aspek.toLowerCase());
return kal+(baik.length?` ${nama} sudah berkembang baik pada aspek ${gabung(baik)}.`:'')+(perlu.length?` Aspek yang masih memerlukan stimulasi dan pendampingan: ${gabung(perlu)}.`:'')}

<script>
/* Pemilih tanggal/bulan terang untuk layar sentuh (pemilih bawaan HP mengikuti mode gelap sistem) */
(function(){
if(!window.matchMedia||!matchMedia('(pointer:coarse)').matches)return;
var BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],BS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],HR=['M','S','S','R','K','J','S'];
var p2=function(n){return('0'+n).slice(-2)};
function tgl(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function kirim(inp,v){inp.value=v;['input','change'].forEach(function(t){inp.dispatchEvent(new Event(t,{bubbles:true}))})}
function buka(inp){
 if(document.querySelector('.dpm'))return;
 var bulan=inp.type==='month',now=tgl(),v=inp.value||'',pv=(bulan?v+'-01':v).match(/^(\d{4})-(\d{2})-(\d{2})/);
 var th=pv?+pv[1]:+now.slice(0,4),bl=pv?+pv[2]-1:+now.slice(5,7)-1,mode=bulan?'bln':'hari';
 var m=document.createElement('div');m.className='dpm';document.body.appendChild(m);
 function tutup(){m.remove()}
 function gambar(){
  var h='<div class="dpc"><div class="dph"><button type="button" class="dpn" data-n="-1">‹</button><div class="dpt">'+(mode==='bln'?th:BLN[bl]+' '+th)+'</div><button type="button" class="dpn" data-n="1">›</button></div>';
  if(mode==='bln'){h+='<div class="dpm12">'+BS.map(function(b,i){var k=th+'-'+p2(i+1);return'<button type="button" class="dpd'+(k===v?' on':(k===now.slice(0,7)?' td':''))+'" data-m="'+i+'">'+b+'</button>'}).join('')+'</div>'}
  else{
   h+='<div class="dpg">'+HR.map(function(x){return'<div class="dpw">'+x+'</div>'}).join('')+'</div><div class="dpg dpb">';
   var aw=new Date(th,bl,1).getDay(),n=new Date(th,bl+1,0).getDate(),i;
   for(i=0;i<aw;i++)h+='<span></span>';
   for(i=1;i<=n;i++){var k=th+'-'+p2(bl+1)+'-'+p2(i);h+='<button type="button" class="dpd'+(k===v?' on':(k===now?' td':''))+'" data-d="'+k+'">'+i+'</button>'}
   h+='</div>';
  }
  h+='<div class="dpa"><button type="button" data-a="x">Batal</button><button type="button" data-a="h">'+(bulan?'Bulan ini':'Hari ini')+'</button><button type="button" data-a="k">Kosongkan</button></div></div>';
  m.innerHTML=h;
 }
 m.addEventListener('click',function(e){
  if(e.target===m)return tutup();
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.n){var n=+b.dataset.n;if(mode==='bln')th+=n;else{bl+=n;if(bl<0){bl=11;th--}if(bl>11){bl=0;th++}}return gambar()}
  if(b.dataset.d){kirim(inp,b.dataset.d);return tutup()}
  if(b.dataset.m){kirim(inp,th+'-'+p2(+b.dataset.m+1));return tutup()}
  if(b.dataset.a==='x')return tutup();
  if(b.dataset.a==='k'){kirim(inp,'');return tutup()}
  if(b.dataset.a==='h'){kirim(inp,bulan?now.slice(0,7):now);return tutup()}
 });
 gambar();
}
function sasar(e){var t=e.target;return t&&t.tagName==='INPUT'&&(t.type==='date'||t.type==='month')&&!t.disabled?t:null}
document.addEventListener('pointerdown',function(e){var t=sasar(e);if(t)t.readOnly=true},true);
document.addEventListener('click',function(e){var t=sasar(e);if(!t)return;e.preventDefault();e.stopPropagation();t.blur();buka(t)},true);
})();
