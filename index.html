<body>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbx-8q1qhUFuy-j6O6DaJsHrBpXf5PfAwpuykLYrAWqjsSvp0QTDNaBW49kNOUe2jSe_/exec'; // URL hasil Deploy Apps Script (berakhiran /exec)

/* ---------- util ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hari=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=d=>{try{return new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
const tgl=d=>{const p=String(d).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d};
const blnNama=ym=>new Date(ym+'-01T00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const N=(a,b,s=1)=>{const r=[];for(let i=a;i<=b;i+=s)r.push(String(i));return r};
const sum=(rs,k)=>rs.reduce((a,r)=>a+(+r[k]||0),0);
const pct=(a,b)=>b?Math.round(a/b*1000)/10+'%':'-';
let S={token:null,guru:null,view:'beranda'},ROWS={},tt;
try{const x=JSON.parse(localStorage.getItem('jg')||'null');if(x){S.token=x.token;S.guru=x.guru}}catch(e){}
const simpanSesi=()=>{try{localStorage.setItem('jg',JSON.stringify({token:S.token,guru:S.guru}))}catch(e){}};

/* ---------- suara tombol dan pilihan ---------- */
let ac;
function bunyi(t='klik'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
const f={klik:[620],ok:[520,780],err:[240,180],pin:[880]}[t];
f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+i*.09;o.frequency.value=hz;o.connect(g);g.connect(ac.destination);
g.gain.setValueAtTime(.12,s);g.gain.exponentialRampToValueAtTime(.001,s+.1);o.start(s);o.stop(s+.11)})}catch(e){}}
function toast(m,er){const e=$('#toast');e.textContent=m;e.className='show'+(er?' er':'');bunyi(er?'err':'ok');clearTimeout(tt);tt=setTimeout(()=>e.className='',2800)}
document.addEventListener('click',e=>{const t=e.target;if(t.closest('button')||(t.closest('.op')&&t.tagName!=='INPUT'))bunyi()});
document.addEventListener('change',e=>{const t=e.target;
if(t.matches('input[type=date],input[type=month]'))bunyi('pin');
const fd=t.closest&&t.closest('.fd[data-m]');if(!fd||t.type==='hidden')return;
if(fd.dataset.m==='combo'&&t.type==='radio'){const x=fd.querySelector('.ex');if(x)x.value=''}
syncOpt(fd)});

/* ---------- komponen isian: semua pilihan berupa radio button ---------- */
const opts=(name,o,sel)=>`<div class="opts">${o.map(x=>`<label class="op"><input type="radio" name="r_${name}" value="${esc(x)}"${String(x)===String(sel)?' checked':''}><span>${esc(x)}</span></label>`).join('')}</div>`;
function fld(f,v){v=String(v??'');const L=`<label>${f.l}</label>`;
if(f.t==='date')return`<div class="fd">${L}<input type="date" name="${f.k}" value="${esc(v||hari())}"></div>`;
if(f.t==='txt')return`<div class="fd">${L}<input name="${f.k}" value="${esc(v)}" autocomplete="off"></div>`;
if(f.t==='sel'){
if(f.o.every(x=>/^\d+$/.test(x))){const val=v!==''?v:(f.o[0]==='0'?'0':'');
return`<div class="fd">${L}<div class="stp"><button type="button" data-st="-1" aria-label="Kurangi">−</button><input type="number" inputmode="numeric" name="${f.k}" min="${f.o[0]}" max="${f.o[f.o.length-1]}" value="${esc(val)}"><button type="button" data-st="1" aria-label="Tambah">+</button></div></div>`}
const o=!v||f.o.includes(v)?f.o:[...f.o,v];
return`<div class="fd full" data-m="sel">${L}<input type="hidden" name="${f.k}" value="${esc(v)}">${opts(f.k,o,v)}</div>`}
if(f.t==='combo'){
if(!f.o.length)return`<div class="fd">${L}<input name="${f.k}" value="${esc(v)}" list="dl_${f.k}" autocomplete="off"><datalist id="dl_${f.k}"></datalist></div>`;
const hit=f.o.includes(v);
return`<div class="fd full" data-m="combo">${L}<input type="hidden" name="${f.k}" value="${esc(v)}">${opts(f.k,f.o,hit?v:'')}<input class="ex" placeholder="Atau ketik sendiri" value="${hit?'':esc(v)}"></div>`}
const o=f.o.find(x=>v===x||v.startsWith(x+'. ')),ex=o?v.slice(o.length).replace(/^\. /,''):v;
return`<div class="fd full" data-m="area">${L}<input type="hidden" name="${f.k}" value="${esc(v)}">${opts(f.k,f.o,o||'')}<textarea class="ex" placeholder="Catatan tambahan (boleh dikosongkan)">${esc(ex)}</textarea></div>`}
function syncOpt(fd){const h=fd.querySelector('input[type=hidden]'),m=fd.dataset.m,r=fd.querySelector('input[type=radio]:checked'),x=(fd.querySelector('.ex')||{value:''}).value.trim(),old=h.value;
h.value=m==='sel'?(r?r.value:''):m==='combo'?(x||(r?r.value:'')):[r&&r.value,x].filter(Boolean).join('. ');
if(h.value!==old)h.dispatchEvent(new Event('change',{bubbles:true}))}
function pilih(root,n,v){const h=root.querySelector(`input[type=hidden][name=${n}]`);if(!h)return;const fd=h.closest('.fd');fd.querySelectorAll('input[type=radio]').forEach(r=>r.checked=r.value===v);syncOpt(fd)}
function stepClick(e){const st=e.target.closest('[data-st]');if(!st)return false;const i=st.parentNode.querySelector('input'),mn=+i.min,mx=+i.max;i.value=Math.min(mx,Math.max(mn,(+i.value||0)+ +st.dataset.st));return true}
function ambil(root,fields){const d={};let kurang=null;
fields.forEach(f=>{const e=root.querySelector(`[name=${f.k}]`);const v=e.value.trim();d[f.k]=v;if(!v&&f.t!=='area'&&!f.opt&&!kurang)kurang=f.l});
return{d,kurang}}
const radioGrup=(name,list,sel,id)=>`<div class="opts" id="${id}">${list.map(([v,l])=>`<label class="op"><input type="radio" name="${name}" value="${esc(v)}"${v===sel?' checked':''}><span>${esc(l)}</span></label>`).join('')}</div>`;

/* ---------- data siswa dan presensi ----------
   Presensi per anak hanya muncul pada tanggal yang Jurnal Kehadirannya sudah diisi.
   Jika jurnal kosong pada periode itu, tabel tidak ditampilkan (j.hari = 0). */
const kelNorm=v=>{const m=String(v||'').trim().match(/^(?:TK|KELOMPOK)?[\s\-_]*([AB])$/i);return m?'Kelompok '+m[1].toUpperCase():String(v||'').trim()};
const klf=()=>{const k=kelNorm(S.guru&&S.guru.kelas);return k&&!/^(semua|guru )/i.test(k)?k:''};
const PRES_KOSONG='Belum ada Jurnal Kehadiran pada periode ini, sehingga presensi per anak belum ditampilkan. Isi dulu di menu 3. Kehadiran Anak.';
function presTabel(j,cls=''){if(!j||j.err)return`<p>Data presensi belum dapat dimuat${j&&j.err?': '+esc(j.err):''}.</p>`;
if(!j.hari)return`<div class="empty" style="padding:16px">${PRES_KOSONG}</div>`;
const rs=j.rows,T=['hadir','sakit','izin','alpha'].map(k=>sum(rs,k)),tot=T.reduce((a,b)=>a+b,0);
return`<p style="margin:0 0 6px">Hari jurnal kehadiran pada periode ini: <b>${j.hari}</b></p><div class="ov"><table class="rt ${cls}"><thead><tr><th>No</th><th>Nama anak</th><th>Kelompok</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Tanpa keterangan</th><th>% hadir</th></tr></thead><tbody>${rs.length?rs.map((r,i)=>{const t=r.hadir+r.sakit+r.izin+r.alpha;return`<tr><td class="c">${i+1}</td><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td class="c">${r.hadir}</td><td class="c">${r.sakit}</td><td class="c">${r.izin}</td><td class="c">${r.alpha}</td><td class="c">${pct(r.hadir,t)}</td></tr>`}).join('')+`<tr class="tt"><td colspan="3">Total</td>${T.map(x=>`<td class="c">${x}</td>`).join('')}<td class="c">${pct(T[0],tot)}</td></tr>`:'<tr><td class="c" colspan="8">Tidak ada data.</td></tr>'}</tbody></table></div>`}

/* ---------- laporan formal ---------- */
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function rentang(j,tg,bl){
if(j==='harian')return{dari:tg,sampai:tg,label:fmt(tg),judul:'HARIAN'};
if(j==='mingguan'){const d=new Date(tg+'T00:00'),a=new Date(d);a.setDate(d.getDate()-(d.getDay()+6)%7);const e=new Date(a);e.setDate(a.getDate()+6);
return{dari:iso(a),sampai:iso(e),label:`Minggu ${tgl(iso(a))} s.d. ${tgl(iso(e))}`,judul:'MINGGUAN'}}
if(j==='bulanan'){const[y,m]=bl.split('-');return{dari:bl+'-01',sampai:bl+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'),label:blnNama(bl),judul:'BULANAN'}}
return{dari:'',sampai:'',label:'Seluruh periode',judul:''}}

async function viewLaporan(){const m=$('#main');
m.innerHTML=`<div class="card noprint"><div class="fd"><label>Jenis laporan</label>${radioGrup('lj',[['harian','Per hari'],['mingguan','Per minggu'],['bulanan','Per bulan'],['semua','Seluruh periode']],'bulanan','lj')}</div><div class="filt" style="margin-top:14px"><div class="fd"><label for="lt">Periode</label><input type="date" id="lt" value="${hari()}" style="width:210px"><input type="month" id="lb" value="${hari().slice(0,7)}" style="width:210px"></div><small class="sub" id="lh"></small></div>${ukrHtml()}</div><div id="lap">${muat()}</div>`;
$('.ukr').onclick=e=>{const b=e.target.closest('[data-ak]');if(b)aksiLap(b.dataset.uk,b.dataset.ak)};
const inp=()=>{const j=nilai('lj');$('#lt').style.display=j==='harian'||j==='mingguan'?'':'none';$('#lb').style.display=j==='bulanan'?'':'none';$('#lh').textContent=j==='mingguan'?'Pilih tanggal mana saja di minggu itu (Senin sampai Minggu)':''};
try{await muatSemua();if(S.view!=='laporan')return;
const r=async()=>{inp();const rg=rentang(nilai('lj'),$('#lt').value||hari(),$('#lb').value||hari().slice(0,7));$('#lap').innerHTML=muat();
let p;try{p=await api('presensi',{dari:rg.dari,sampai:rg.sampai,kelas:klf()})}catch(e){p={err:e.message}}
if(S.view==='laporan')$('#lap').innerHTML=laporan(rg,p)};
['#lj','#lt','#lb'].forEach(x=>$(x).onchange=r);r()}
catch(e){$('#lap').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
/* ---------- cetak, simpan PDF, simpan gambar (A4 dan HVS, potret) ---------- */
const UK={a4:{n:'A4',w:210,h:297},hvs:{n:'HVS',w:215,h:330}},MM=96/25.4,MG=10; // ukuran mm, margin 10 mm
const cm=v=>String(v/10).replace('.',',');
function ukrHtml(){return`<div class="ukr">${Object.entries(UK).map(([c,u])=>`<div class="ukb"><b>${u.n} <small>(${cm(u.w)} x ${cm(u.h)} cm, potret)</small></b><button class="btn o s" data-uk="${c}" data-ak="cetak">🖨️ Cetak</button><button class="btn s" data-uk="${c}" data-ak="pdf">📄 Simpan PDF</button><button class="btn y s" data-uk="${c}" data-ak="img">🖼️ Simpan Gambar</button></div>`).join('')}</div>`}
const _js={};
const loadJs=u=>_js[u]||(_js[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>{delete _js[u];no(new Error('Gagal memuat pustaka PDF/gambar. Periksa koneksi internet.'))};document.head.appendChild(s)}));
const libs=()=>Promise.all([loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);
function setKertas(u){let s=$('#pgsty');if(!s){s=document.createElement('style');s.id='pgsty';document.head.appendChild(s)}s.textContent=`@page{size:${u.w}mm ${u.h}mm;margin:${MG}mm}`}
// render laporan menjadi kanvas per halaman, dipotong di batas baris tabel agar teks tidak terpotong
async function halaman(u){const src=$('#lap .paper');if(!src)throw new Error('Laporan belum siap dimuat.');
await libs();
const W=Math.round(u.w*MM),H=Math.round(u.h*MM),mg=Math.round(MG*MM),use=H-2*mg;
const box=document.createElement('div');box.id='capbox';box.className='cap';
box.style.cssText=`position:absolute;left:-99999px;top:0;width:${W}px;padding:0 ${mg}px;background:#fff;box-sizing:border-box`;
box.appendChild(src.cloneNode(true));document.body.appendChild(box);
try{const top=box.getBoundingClientRect().top,pts=new Set();
box.querySelectorAll('tr,p,.ttd,.kop').forEach(e=>{if(!e.closest('thead'))pts.add(Math.round(e.getBoundingClientRect().bottom-top))});
box.querySelectorAll('h3,h4').forEach(e=>pts.add(Math.round(e.getBoundingClientRect().top-top)));
const total=Math.ceil(box.getBoundingClientRect().height),sorted=[...pts].sort((a,b)=>a-b);
const cv=await html2canvas(box,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:W,onclone:d=>{const b=d.getElementById('capbox');if(b)b.style.left='0'}});
const k=cv.width/W,pages=[];let y=0;
while(y<total-1){let cut=Math.min(y+use,total);
if(total-y>use){const c=sorted.filter(p=>p>y+use*.35&&p<=y+use);if(c.length)cut=c[c.length-1]}
pages.push([y,cut]);y=cut}
return pages.map(([a,b])=>{const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);
const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
const sy=Math.round(a*k),sh=Math.min(Math.round((b-a)*k),cv.height-sy);
x.drawImage(cv,0,sy,cv.width,sh,0,Math.round(mg*k),cv.width,sh);return c})}
finally{box.remove()}}
const unduh=(href,nama)=>{const a=document.createElement('a');a.href=href;a.download=nama;document.body.appendChild(a);a.click();a.remove()};
async function aksiLap(c,ak){const u=UK[c];if(!u)return;
if(ak==='cetak'){if(!$('#lap .paper'))return toast('Laporan belum siap dimuat',1);setKertas(u);window.print();return}
const bt=document.querySelectorAll('.ukr button');bt.forEach(b=>b.disabled=true);toast('Menyiapkan '+(ak==='pdf'?'PDF':'gambar')+' '+u.n+'...');
const nama='Laporan-Jurnal-'+String((S.guru&&S.guru.nama)||'guru').replace(/[^\w]+/g,'_')+'-'+u.n;
try{const cs=await halaman(u);
if(ak==='pdf'){const{jsPDF}=window.jspdf,doc=new jsPDF({orientation:'portrait',unit:'mm',format:[u.w,u.h]});
cs.forEach((cv,i)=>{if(i)doc.addPage([u.w,u.h],'portrait');doc.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,u.w,u.h)});
doc.save(nama+'.pdf');toast('PDF '+u.n+' tersimpan ('+cs.length+' halaman)')}
else{for(let i=0;i<cs.length;i++){unduh(cs[i].toDataURL('image/png'),nama+(cs.length>1?'-hal'+(i+1):'')+'.png');if(i<cs.length-1)await new Promise(r=>setTimeout(r,500))}
toast('Gambar '+u.n+' tersimpan ('+cs.length+' halaman)')}}
catch(e){toast(e.message||'Gagal membuat file',1)}
bt.forEach(b=>b.disabled=false)}
const opsi=(k,f)=>J[k].f.find(x=>x.k===f).o;
function dist(jd,rs,key,ops){const t=rs.length;
return`<table class="rt sm"><thead><tr><th>${jd}</th><th>Jumlah</th><th>Persentase</th></tr></thead><tbody>${ops.map(o=>{const n=rs.filter(r=>r[key]===o).length;return`<tr><td>${esc(o)}</td><td class="c">${n}</td><td class="c">${pct(n,t)}</td></tr>`}).join('')}<tr class="tt"><td>Total</td><td class="c">${t}</td><td class="c">${t?'100%':'-'}</td></tr></tbody></table>`}
function tabel(k,rs){const j=J[k];
return`<table class="rt"><thead><tr><th>No</th>${j.f.map(f=>`<th>${f.l}</th>`).join('')}</tr></thead><tbody>${rs.length?rs.map((r,i)=>`<tr><td class="c">${i+1}</td>${j.f.map(f=>`<td>${f.k==='tanggal'?tgl(r.tanggal):esc(r[f.k])}</td>`).join('')}</tr>`).join(''):`<tr><td class="c" colspan="${j.f.length+1}">Tidak ada catatan pada periode ini.</td></tr>`}</tbody></table>`}
function laporan(rg,pres){const g=S.guru,per=rg.label;
const F=k=>(ROWS[k]||[]).filter(r=>!rg.dari||(r.tanggal>=rg.dari&&r.tanggal<=rg.sampai)).slice().sort((a,b)=>String(a.tanggal).localeCompare(String(b.tanggal)));
const kh=F('kehadiran'),pn=F('penilaian'),jh=sum(kh,'jumlah'),tn=sum(pn,'bb')+sum(pn,'mb')+sum(pn,'bsh')+sum(pn,'bsb');
const idn=[['Nama guru',g.nama],['NIP / NUPTK',g.nip],['Status kepegawaian',g.status],['Nama sekolah',g.sekolah],['NPSN',g.npsn],['Jenjang',g.jenjang],['Kelompok yang diampu',g.kelas],['Tahun ajaran',g.tahun],['Semester',g.semester],['Kepala sekolah',g.kepsek]];
const today=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
return`<div class="paper"><div class="kop"><h2>${esc((g.sekolah||'NAMA SEKOLAH').toUpperCase())}</h2><p>${esc(g.jenjang||'')}${g.npsn?' - NPSN '+esc(g.npsn):''}</p></div>
<h1 class="jd">LAPORAN JURNAL GURU${rg.judul?' '+rg.judul:''}</h1><p class="sj">Tahun ajaran ${esc(g.tahun||'-')}, semester ${esc(g.semester||'-')}<br>Periode: ${esc(per)}</p>
<h3>A. Identitas guru dan sekolah</h3><table class="rt id">${idn.map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1]||'-')}</td></tr>`).join('')}</table>
<h3>B. Ringkasan hasil</h3>
<h4>1. Jumlah catatan per jurnal</h4><table class="rt sm"><thead><tr><th>No</th><th>Jenis jurnal</th><th>Periode pengisian</th><th>Jumlah catatan</th></tr></thead><tbody>${KEYS.map((k,i)=>`<tr><td class="c">${i+1}</td><td>${J[k].n}</td><td>${J[k].per}</td><td class="c">${F(k).length}</td></tr>`).join('')}<tr class="tt"><td colspan="3">Total</td><td class="c">${KEYS.reduce((a,k)=>a+F(k).length,0)}</td></tr></tbody></table>
<h4>2. Rekapitulasi kehadiran anak</h4><table class="rt sm"><thead><tr><th>Hari tercatat</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Tanpa keterangan</th><th>Persentase hadir</th></tr></thead><tbody><tr class="c"><td class="c">${kh.length}</td><td class="c">${sum(kh,'hadir')}</td><td class="c">${sum(kh,'sakit')}</td><td class="c">${sum(kh,'izin')}</td><td class="c">${sum(kh,'alpha')}</td><td class="c">${pct(sum(kh,'hadir'),jh)}</td></tr></tbody></table>
<h4>3. Capaian perkembangan anak</h4>${dist('Tingkat capaian',F('perkembangan'),'tingkat',TKT)}
<h4>4. Hasil penilaian pembelajaran</h4><table class="rt sm"><thead><tr><th>Tingkat capaian</th><th>Jumlah anak</th><th>Persentase</th></tr></thead><tbody>${[['bb',TKT[0]],['mb',TKT[1]],['bsh',TKT[2]],['bsb',TKT[3]]].map(x=>`<tr><td>${x[1]}</td><td class="c">${sum(pn,x[0])}</td><td class="c">${pct(sum(pn,x[0]),tn)}</td></tr>`).join('')}<tr class="tt"><td>Total</td><td class="c">${tn}</td><td class="c">${tn?'100%':'-'}</td></tr></tbody></table>
<h4>5. Ketercapaian kegiatan harian</h4>${dist('Ketercapaian',F('harian'),'capaian',opsi('harian','capaian'))}
<h4>6. Hasil kegiatan kokurikuler</h4>${dist('Hasil kegiatan',F('kokurikuler'),'hasil',opsi('kokurikuler','hasil'))}
<h3>C. Rincian isian jurnal</h3>${KEYS.map((k,i)=>`<h4>${i+1}. ${J[k].n}</h4><div class="ov">${tabel(k,F(k))}</div>`).join('')}
<h3>D. Data siswa dan presensi per anak</h3><p style="margin:0 0 4px;font-size:12px">Sumber: Rekap Absen${klf()?', '+klf():''}, hanya pada tanggal yang Jurnal Kehadirannya sudah diisi.</p>${presTabel(pres)}
<div class="ttd"><div><p>Mengetahui,<br>Kepala ${esc(g.sekolah||'sekolah')}</p><div class="sp"></div><b><u>${esc(g.kepsek||'..............................')}</u></b></div>
<div><p>Surabaya, ${today}<br>Guru ${esc(g.kelas||'kelompok')}</p><div class="sp"></div><b><u>${esc(g.nama)}</u></b></div></div></div>`}
