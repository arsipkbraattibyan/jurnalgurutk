<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jurnal Guru TK</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#8a76e0;--pd:#6b57c9;--ink:#2e2a4f;--mut:#7a7498;--ln:#e6e0f7;--sh:0 6px 20px #6b57c91a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#efeafc,#e3ddf6) fixed}
button{font:inherit;cursor:pointer}h1,h2,h3,p{margin:0}
.app{max-width:1220px;margin:0 auto;padding:16px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.sb{background:linear-gradient(180deg,#b3a5ee,#9686df);color:#fff;border-radius:28px;padding:20px 14px;position:sticky;top:16px;min-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:16px}
.sbt{text-align:center}.sbt b{display:block;margin-top:8px;font-size:18px}.sbt small{opacity:.85}
nav{display:grid;gap:4px}
.nv{display:flex;gap:10px;align-items:center;border:0;background:none;color:#fff;padding:10px 14px;border-radius:14px;text-align:left;font-weight:600}
.nv:hover{background:#ffffff33}.nv.on{background:#fff;color:var(--pd);font-weight:800}
.sbf{margin-top:auto;background:#fbd9e0;color:#7a2c46;border-radius:20px;padding:14px;text-align:center}
.sbf p{font-size:13px;margin:2px 0 10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.hd h1{font-size:26px;font-weight:800}
.cu{display:flex;align-items:center;gap:8px;background:#fff;border-radius:99px;padding:4px 6px 4px 4px;font-weight:700;box-shadow:var(--sh)}
.cu span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#f7c96b;color:#4a3510;display:inline-grid;place-items:center;font-weight:800;border:3px solid #fff;flex:none}
.sbt .av{width:88px;height:88px;font-size:34px}
.sm{border:0;background:#ece6fb;color:var(--pd);border-radius:99px;padding:5px 12px;font-weight:700}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{font-size:16px;font-weight:800;margin-bottom:10px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(120deg,#cfc3f7,#f5cfe3);border-radius:24px;padding:20px 22px;margin-bottom:14px}
.banner h2{font-size:21px;font-weight:800}.banner p{margin:2px 0 12px;color:#4d4575}.big{font-size:64px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.st{border-radius:20px;padding:14px}.st i{font-style:normal;font-size:22px}.st small{display:block;font-weight:600;margin-top:4px}
.st b{display:block;font-size:28px;font-weight:800;line-height:1.2}.st em{font-style:normal;font-size:12px;color:var(--mut)}
.t1{background:#e6dcfb}.t2{background:#fbdde3}.t3{background:#fdf0cf}.t4{background:#dcecfb}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mut)}
.bars i{width:100%;border-radius:10px 10px 5px 5px;margin-bottom:4px;min-height:4px}
.dw{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dn{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.dn span{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.1}
.dn small{display:block;font-weight:600;color:var(--mut);font-size:11px}
.lgd div{display:flex;gap:8px;align-items:center;font-size:13px;margin:3px 0}.lgd i{width:11px;height:11px;border-radius:50%}
.rc{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.rc .ico{width:42px;height:42px;border-radius:12px;background:#ece6fb;display:grid;place-items:center;font-size:20px;flex:none}
.rc small{display:block;color:var(--mut)}.rc .ar{margin-left:auto;color:var(--p);font-size:22px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(120deg,#cfc3f7,#e3d8fb);border-radius:22px;padding:16px 20px;margin-bottom:14px}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:800}
.btn:hover{background:var(--pd)}.btn.gh{background:#ece6fb;color:var(--pd)}.btn.rd{background:#fde2e4;color:#a1304a}.btn.am{background:#f7c96b;color:#4a3510}.btn.s{padding:6px 14px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.sub{color:var(--mut);font-weight:600}
.row small{color:var(--mut)}.row h3{margin:0 0 4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 16px;margin:8px 0 12px}
.kv small{display:block;font-size:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fd label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}.fd.full{grid-column:1/-1}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px #8a76e033}
textarea{min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--ln);background:#f6f3fe;color:var(--pd);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600}
.chip:active{background:var(--p);color:#fff}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.md{position:fixed;inset:0;background:#2e2a4f88;display:flex;align-items:center;justify-content:center;z-index:20;padding:10px}
.sheet{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:700px;max-height:92vh;overflow:auto}
.sheet h2{font-size:19px;margin-bottom:14px}
.empty{text-align:center;color:var(--mut);padding:30px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,90px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;transition:.25s;z-index:30;max-width:90%}
#toast.show{transform:translate(-50%,0)}#toast.er{background:#b23a55}
.lg{min-height:100vh;display:grid;place-items:center;padding:14px}
.lgbox{background:#fff;border-radius:28px;padding:28px 24px;width:100%;max-width:390px;text-align:center;box-shadow:0 14px 40px #6b57c933}
.logo{width:60px;height:60px;border-radius:18px;background:#ece6fb;display:grid;place-items:center;font-size:30px;margin:0 auto 8px}
.lgbox h1{font-size:25px;font-weight:800}.lgbox .sub{margin:2px 0 16px}
.lgbox .fd{text-align:left;margin-bottom:12px}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0 14px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--p)}.dots i.on{background:var(--p)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
.pad button{height:56px;border-radius:16px;border:0;background:#f3effd;font-size:21px;font-weight:800;color:var(--ink)}
.pad button:active{background:#f7c96b}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.paper{background:#fff;color:#111;max-width:1050px;margin:0 auto;padding:30px 34px;font:13px/1.55 Georgia,'Times New Roman',serif;box-shadow:var(--sh);border-radius:6px}
.kop{text-align:center;border-bottom:4px double #111;padding-bottom:10px;margin-bottom:14px}
.kop h2{font-size:19px;letter-spacing:.5px}.kop p{font-size:12px}
.jd{text-align:center;font-size:17px;text-decoration:underline;margin-top:6px}
.sj{text-align:center;margin:4px 0 16px}
.paper h3{font-size:13.5px;text-transform:uppercase;margin:18px 0 6px;break-after:avoid}
.paper h4{font-size:13px;margin:12px 0 4px;break-after:avoid}
.ov{overflow-x:auto}
.rt.ap{font-size:13px}.rt.ap th,.rt.ap td{border-color:#e6e0f7;padding:8px}.rt.ap th{background:#ece6fb}.rt.ap .tt td{background:#f6f3fe}
.rt{width:100%;border-collapse:collapse;font-size:11.5px}
.rt th,.rt td{border:1px solid #333;padding:4px 6px;vertical-align:top;text-align:left}
.rt th{background:#e8e8e8;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rt .c{text-align:center}.rt.sm{width:70%}.rt.id td:first-child{width:28%;font-weight:bold}.rt .tt td{font-weight:bold;background:#f3f3f3}
.ttd{display:flex;justify-content:space-between;gap:20px;margin-top:30px;text-align:center;break-inside:avoid}
.ttd>div{width:45%}.ttd .sp{height:70px}
@media(max-width:820px){
.app{display:block;padding:10px}
.sb{position:static;min-height:0;border-radius:22px;padding:12px;margin-bottom:12px;gap:10px}
.sbt{display:flex;align-items:center;gap:10px;text-align:left}.sbt .av{width:48px;height:48px;font-size:20px}.sbt b{margin:0}
nav{display:flex;overflow-x:auto;gap:6px}.nv{white-space:nowrap;padding:8px 12px;background:#ffffff26}
.sbf{display:none}.hd h1{font-size:20px}.cu span{max-width:80px}.paper{padding:16px}}
@page{size:A4 landscape;margin:14mm}
@media print{body{background:#fff}.sb,.hd,.noprint,#toast,.md{display:none!important}.app{display:block;padding:0}.paper{box-shadow:none;padding:0;max-width:none}thead{display:table-header-group}tr{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbx-8q1qhUFuy-j6O6DaJsHrBpXf5PfAwpuykLYrAWqjsSvp0QTDNaBW49kNOUe2jSe_/exec'; // URL hasil Deploy Apps Script (berakhiran /exec)

/* ---------- util ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hari=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=d=>{try{return new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
const tgl=d=>{const p=String(d).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d};
const blnNama=ym=>new Date(ym+'-01T00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const N=(a,b,s=1)=>{const r=[];for(let i=a;i<=b;i+=s)r.push(String(i));return r};
const sum=(rs,k)=>rs.reduce((a,r)=>a+(+r[k]||0),0);
const pct=(a,b)=>b?Math.round(a/b*1000)/10+'%':'-';
let S={token:null,guru:null,view:'beranda'},ROWS={},tt;
try{const x=JSON.parse(localStorage.getItem('jg')||'null');if(x){S.token=x.token;S.guru=x.guru}}catch(e){}
const simpanSesi=()=>{try{localStorage.setItem('jg',JSON.stringify({token:S.token,guru:S.guru}))}catch(e){}};

/* ---------- suara tombol ---------- */
let ac;
function bunyi(t='klik'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
const f={klik:[620],ok:[520,780],err:[240,180],pin:[880]}[t];
f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+i*.09;o.frequency.value=hz;o.connect(g);g.connect(ac.destination);
g.gain.setValueAtTime(.12,s);g.gain.exponentialRampToValueAtTime(.001,s+.1);o.start(s);o.stop(s+.11)})}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('button,.nv'))bunyi()});
document.addEventListener('change',e=>{if(e.target.matches('select,input[type=date],input[type=month]'))bunyi('pin')});
function toast(m,er){const e=$('#toast');e.textContent=m;e.className='show'+(er?' er':'');bunyi(er?'err':'ok');clearTimeout(tt);tt=setTimeout(()=>e.className='',2800)}

/* ---------- API ---------- */
async function api(action,p={}){
const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,token:S.token,...p})});
const j=await r.json();
if(!j.ok){if(j.auth)keluar();throw new Error(j.error||'Terjadi kesalahan')}
return j}
const urut=a=>a.sort((x,y)=>String(y.tanggal).localeCompare(String(x.tanggal)));
async function muatSemua(){
try{const j=await api('semua');KEYS.forEach(k=>ROWS[k]=urut(j.data[k]||[]))}
catch(e){if(!/tidak dikenal/i.test(e.message))throw e;
const r=await Promise.all(KEYS.map(k=>api('list',{jenis:k})));KEYS.forEach((k,i)=>ROWS[k]=urut(r[i].rows))}}

/* ---------- foto (diisi admin lewat kolom foto di sheet Guru, boleh kosong) ---------- */
function fu(u){if(!u)return'';const m=String(u).match(/(?:\/d\/|[?&]id=)([-\w]{20,})/);return m&&!/thumbnail/.test(u)?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w300':u}
function av(foto,nama){const i=esc((nama||'?').trim().charAt(0).toUpperCase()).replace(/'/g,'');
return foto?`<img class="av" src="${esc(fu(foto))}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;av&quot;>${i}</span>'">`:`<span class="av">${i}</span>`}

/* ---------- definisi jurnal (versi TK) ---------- */
const KELAS=['Kelompok A','Kelompok B'];
const TEMA=['Diriku','Lingkunganku','Kebutuhanku','Binatang','Tanaman','Alam semesta','Pekerjaan','Rekreasi','Transportasi','Komunikasi','Kebangsaanku'];
const ASPEK=['Nilai agama dan budi pekerti','Jati diri','Literasi','Matematika dan sains','Teknologi dan rekayasa','Seni','Fisik motorik'];
const TGL={k:'tanggal',l:'Tanggal',t:'date'};
const K={k:'kelas',l:'Kelompok',t:'sel',o:KELAS};
const TM={k:'tema',l:'Tema',t:'sel',o:TEMA};
const TKT=['Belum Berkembang (BB)','Mulai Berkembang (MB)','Berkembang Sesuai Harapan (BSH)','Berkembang Sangat Baik (BSB)'];
const J={
identitas:{n:'Identitas Guru dan Sekolah',no:1,ic:'🪪',per:'Tahunan'},
harian:{n:'Jurnal Harian Mengajar',no:2,ic:'📘',per:'Harian',daily:1,
f:[TGL,K,TM,
{k:'subtema',l:'Subtema',t:'combo',o:['Anggota tubuh','Keluargaku','Rumahku','Makanan sehat','Kebersihan','Hewan peliharaan','Kebun sekolah','Kendaraan darat','Profesi di sekitarku']},
{k:'sentra',l:'Sentra / area bermain',t:'sel',o:['Sentra balok','Sentra persiapan','Sentra seni','Sentra imtaq','Sentra bahan alam','Sentra main peran','Bermain di luar kelas','Kegiatan klasikal']},
{k:'kegiatan',l:'Kegiatan inti',t:'combo',o:['Menggambar bebas','Menyusun balok','Bermain peran','Mewarnai','Menggunting dan menempel','Bernyanyi dan bergerak','Mengenal huruf dan angka','Bermain pasir atau air','Bercerita']},
{k:'metode',l:'Cara bermain / metode',t:'sel',o:['Bermain bebas','Bercerita','Demonstrasi','Bernyanyi','Percobaan sederhana','Karyawisata','Proyek']},
{k:'capaian',l:'Antusias dan ketercapaian',t:'sel',o:['Semua anak antusias','Sebagian besar antusias','Sebagian anak antusias','Perlu stimulasi ulang']},
{k:'kendala',l:'Kendala',t:'area',o:['Tidak ada kendala','Anak rewel atau menangis','Alat main kurang','Cuaca hujan','Anak sulit fokus','Waktu kurang']},
{k:'tindak',l:'Tindak lanjut',t:'area',o:['Lanjut kegiatan berikutnya','Ulangi kegiatan','Pendampingan individu','Ganti media main','Informasikan ke orang tua']}],
t:r=>`${r.tema||''} - ${r.kegiatan||''} (${r.kelas||''})`},
kehadiran:{n:'Jurnal Kehadiran Anak',no:3,ic:'🧒',per:'Harian',daily:1,
f:[TGL,K,{k:'jumlah',l:'Jumlah anak',t:'sel',o:N(1,30)},{k:'hadir',l:'Hadir',t:'sel',o:N(0,30)},{k:'sakit',l:'Sakit',t:'sel',o:N(0,30)},{k:'izin',l:'Izin',t:'sel',o:N(0,30)},{k:'alpha',l:'Tanpa keterangan',t:'sel',o:N(0,30)},
{k:'catatan',l:'Catatan',t:'area',o:['Semua hadir','Ada anak demam atau sakit','Menunggu surat izin','Orang tua sudah dihubungi','Perlu kunjungan rumah']}],
t:r=>`${r.kelas||''} - hadir ${r.hadir||0} dari ${r.jumlah||0}`},
perkembangan:{n:'Jurnal Perkembangan Anak',no:4,ic:'🌱',per:'Berkala',
f:[TGL,K,{k:'nama',l:'Nama anak',t:'combo',o:[]},{k:'aspek',l:'Aspek perkembangan',t:'sel',o:ASPEK},
{k:'tingkat',l:'Tingkat capaian',t:'sel',o:TKT},
{k:'teknik',l:'Cara mencatat',t:'sel',o:['Catatan anekdot','Hasil karya','Foto berseri','Ceklis','Percakapan']},
{k:'catatan',l:'Catatan pengamatan',t:'area',o:['Aktif dan antusias','Mulai percaya diri','Mau berbagi dan bergantian','Perlu bimbingan','Cepat memahami','Mudah kehilangan fokus','Mulai mandiri']},
{k:'tindak',l:'Tindak lanjut',t:'area',o:['Pendampingan individu','Latihan di rumah bersama orang tua','Variasi kegiatan','Pertahankan capaian','Konsultasi dengan orang tua']}],
t:r=>`${r.nama||''} (${r.kelas||''})`},
penilaian:{n:'Jurnal Penilaian Pembelajaran',no:5,ic:'📝',per:'Harian/Berkala',
f:[TGL,K,TM,{k:'aspek',l:'Aspek yang dinilai',t:'sel',o:ASPEK},
{k:'jenis',l:'Jenis penilaian',t:'sel',o:['Harian','Mingguan','Bulanan','Semester']},
{k:'teknik',l:'Teknik',t:'sel',o:['Catatan anekdot','Hasil karya','Ceklis','Foto berseri','Observasi','Percakapan']},
{k:'peserta',l:'Jumlah anak dinilai',t:'sel',o:N(1,30)},
{k:'bb',l:'Jumlah anak BB',t:'sel',o:N(0,30)},{k:'mb',l:'Jumlah anak MB',t:'sel',o:N(0,30)},{k:'bsh',l:'Jumlah anak BSH',t:'sel',o:N(0,30)},{k:'bsb',l:'Jumlah anak BSB',t:'sel',o:N(0,30)},
{k:'tindak',l:'Tindak lanjut',t:'area',o:['Stimulasi tambahan','Pengayaan kegiatan','Pendampingan individu','Koordinasi dengan orang tua','Masuk laporan perkembangan']}],
t:r=>`${r.jenis||''} - ${r.aspek||''} (${r.kelas||''})`},
kokurikuler:{n:'Jurnal Kegiatan Kokurikuler',no:6,ic:'🎨',per:'Sesuai kegiatan',
f:[TGL,K,{k:'tema',l:'Tema projek',t:'sel',o:['Aku sayang bumi','Aku cinta Indonesia','Kita semua bersaudara','Imajinasiku','Bermain dan bekerja sama','Gaya hidup berkelanjutan','Kearifan lokal']},
{k:'dimensi',l:'Dimensi Profil Pelajar Pancasila',t:'sel',o:['Beriman, bertakwa, dan berakhlak mulia','Berkebinekaan global','Bergotong royong','Mandiri','Bernalar kritis','Kreatif']},
{k:'bentuk',l:'Bentuk kegiatan',t:'sel',o:['Projek kelompok','Karyawisata','Pentas seni','Berkebun bersama','Pameran karya','Kerja bakti kecil','Pembiasaan ibadah']},
{k:'peserta',l:'Jumlah anak ikut',t:'sel',o:N(1,30)},{k:'hasil',l:'Hasil kegiatan',t:'sel',o:['Sangat baik','Baik','Cukup','Perlu pendampingan']},
{k:'catatan',l:'Catatan',t:'area',o:['Anak antusias','Anak mau bekerja sama','Perlu waktu tambahan','Hasil karya dipamerkan','Dokumentasi sudah lengkap']}],
t:r=>r.tema||''},
refleksi:{n:'Jurnal Refleksi Guru',no:7,ic:'💭',per:'Harian',daily:1,
f:[TGL,{k:'suasana',l:'Perasaan hari ini',t:'sel',o:['Sangat senang','Senang','Biasa saja','Lelah','Perlu dukungan']},
{k:'berjalan',l:'Yang berjalan baik',t:'area',o:['Anak antusias bermain','Tujuan kegiatan tercapai','Alat main menarik','Waktu terkelola baik','Kelas nyaman']},
{k:'tantangan',l:'Tantangan',t:'area',o:['Anak sulit fokus','Anak menangis atau rewel','Waktu terbatas','Kemampuan anak beragam','Alat main kurang']},
{k:'rencana',l:'Rencana perbaikan',t:'area',o:['Variasi cara bermain','Pakai benda konkret','Pendampingan individu','Atur ulang jadwal','Konsultasi rekan guru atau orang tua']}],

m.innerHTML=`<div class="card noprint" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label for="lj"><b>Laporan</b></label><select id="lj" style="max-width:170px"><option value="harian">Per hari</option><option value="mingguan">Per minggu</option><option value="bulanan" selected>Per bulan</option><option value="semua">Seluruh periode</option></select><input type="date" id="lt" value="${hari()}" style="max-width:190px"><input type="month" id="lb" value="${hari().slice(0,7)}" style="max-width:190px"><small class="sub" id="lh"></small></div><button class="btn" id="cp">Cetak / simpan PDF</button></div><div id="lap">${muat()}</div>`;
$('#cp').onclick=()=>window.print();
const inp=()=>{const j=$('#lj').value;$('#lt').style.display=j==='harian'||j==='mingguan'?'':'none';$('#lb').style.display=j==='bulanan'?'':'none';$('#lh').textContent=j==='mingguan'?'Pilih tanggal mana saja di minggu itu (Senin sampai Minggu)':''};
try{await muatSemua();if(S.view!=='laporan')return;
const r=async()=>{inp();const rg=rentang($('#lj').value,$('#lt').value||hari(),$('#lb').value||hari().slice(0,7));$('#lap').innerHTML=muat();
let p;try{p=await api('presensi',{dari:rg.dari,sampai:rg.sampai,kelas:klf()})}catch(e){p={err:e.message}}
if(S.view==='laporan')$('#lap').innerHTML=laporan(rg,p)};
['#lj','#lt','#lb'].forEach(x=>$(x).onchange=r);r()}
catch(e){$('#lap').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
const opsi=(k,f)=>J[k].f.find(x=>x.k===f).o;
function dist(jd,rs,key,ops){const t=rs.length;
return`<table class="rt sm"><thead><tr><th>${jd}</th><th>Jumlah</th><th>Persentase</th></tr></thead><tbody>${ops.map(o=>{const n=rs.filter(r=>r[key]===o).length;return`<tr><td>${esc(o)}</td><td class="c">${n}</td><td class="c">${pct(n,t)}</td></tr>`}).join('')}<tr class="tt"><td>Total</td><td class="c">${t}</td><td class="c">${t?'100%':'-'}</td></tr></tbody></table>`}
function tabel(k,rs){const j=J[k];
return`<table class="rt"><thead><tr><th>No</th>${j.f.map(f=>`<th>${f.l}</th>`).join('')}</tr></thead><tbody>${rs.length?rs.map((r,i)=>`<tr><td class="c">${i+1}</td>${j.f.map(f=>`<td>${f.k==='tanggal'?tgl(r.tanggal):esc(r[f.k])}</td>`).join('')}</tr>`).join(''):`<tr><td class="c" colspan="${j.f.length+1}">Tidak ada catatan pada periode ini.</td></tr>`}</tbody></table>`}
function laporan(rg,pres){const g=S.guru,per=rg.label;
const F=k=>(ROWS[k]||[]).filter(r=>!rg.dari||(r.tanggal>=rg.dari&&r.tanggal<=rg.sampai)).slice().sort((a,b)=>String(a.tanggal).localeCompare(String(b.tanggal)));
const kh=F('kehadiran'),pn=F('penilaian'),jh=sum(kh,'jumlah'),tn=sum(pn,'bb')+sum(pn,'mb')+sum(pn,'bsh')+sum(pn,'bsb');
const idn=[['Nama guru',g.nama],['NIP / NUPTK',g.nip],['Status kepegawaian',g.status],['Nama sekolah',g.sekolah],['NPSN',g.npsn],['Jenjang',g.jenjang],['Kelompok yang diampu',g.kelas],['Tahun ajaran',g.tahun],['Semester',g.semester],['Kepala sekolah',g.kepsek]];
const today=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
return`<div class="paper"><div class="kop"><h2>${esc((g.sekolah||'NAMA SEKOLAH').toUpperCase())}</h2><p>${esc(g.jenjang||'')}${g.npsn?' - NPSN '+esc(g.npsn):''}</p></div>
<h1 class="jd">LAPORAN JURNAL GURU${rg.judul?' '+rg.judul:''}</h1><p class="sj">Tahun ajaran ${esc(g.tahun||'-')}, semester ${esc(g.semester||'-')}<br>Periode: ${esc(per)}</p>
<h3>A. Identitas guru dan sekolah</h3><table class="rt id">${idn.map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1]||'-')}</td></tr>`).join('')}</table>
<h3>B. Ringkasan hasil</h3>
<h4>1. Jumlah catatan per jurnal</h4><table class="rt sm"><thead><tr><th>No</th><th>Jenis jurnal</th><th>Periode pengisian</th><th>Jumlah catatan</th></tr></thead><tbody>${KEYS.map((k,i)=>`<tr><td class="c">${i+1}</td><td>${J[k].n}</td><td>${J[k].per}</td><td class="c">${F(k).length}</td></tr>`).join('')}<tr class="tt"><td colspan="3">Total</td><td class="c">${KEYS.reduce((a,k)=>a+F(k).length,0)}</td></tr></tbody></table>
<h4>2. Rekapitulasi kehadiran anak</h4><table class="rt sm"><thead><tr><th>Hari tercatat</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Tanpa keterangan</th><th>Persentase hadir</th></tr></thead><tbody><tr class="c"><td class="c">${kh.length}</td><td class="c">${sum(kh,'hadir')}</td><td class="c">${sum(kh,'sakit')}</td><td class="c">${sum(kh,'izin')}</td><td class="c">${sum(kh,'alpha')}</td><td class="c">${pct(sum(kh,'hadir'),jh)}</td></tr></tbody></table>
<h4>3. Capaian perkembangan anak</h4>${dist('Tingkat capaian',F('perkembangan'),'tingkat',TKT)}
<h4>4. Hasil penilaian pembelajaran</h4><table class="rt sm"><thead><tr><th>Tingkat capaian</th><th>Jumlah anak</th><th>Persentase</th></tr></thead><tbody>${[['bb',TKT[0]],['mb',TKT[1]],['bsh',TKT[2]],['bsb',TKT[3]]].map(x=>`<tr><td>${x[1]}</td><td class="c">${sum(pn,x[0])}</td><td class="c">${pct(sum(pn,x[0]),tn)}</td></tr>`).join('')}<tr class="tt"><td>Total</td><td class="c">${tn}</td><td class="c">${tn?'100%':'-'}</td></tr></tbody></table>
<h4>5. Ketercapaian kegiatan harian</h4>${dist('Ketercapaian',F('harian'),'capaian',opsi('harian','capaian'))}
<h4>6. Hasil kegiatan kokurikuler</h4>${dist('Hasil kegiatan',F('kokurikuler'),'hasil',opsi('kokurikuler','hasil'))}
<h3>C. Rincian isian jurnal</h3>${KEYS.map((k,i)=>`<h4>${i+1}. ${J[k].n}</h4><div class="ov">${tabel(k,F(k))}</div>`).join('')}
<h3>D. Data siswa dan presensi per anak</h3><p style="margin:0 0 4px;font-size:12px">Sumber: sheet Data Siswa dan Rekap Absen${klf()?', '+klf():''}.</p>${presTabel(pres)}
<div class="ttd"><div><p>Mengetahui,<br>Kepala ${esc(g.sekolah||'sekolah')}</p><div class="sp"></div><b><u>${esc(g.kepsek||'..............................')}</u></b></div>
<div><p>..............., ${today}<br>Guru ${esc(g.kelas||'kelompok')}</p><div class="sp"></div><b><u>${esc(g.nama)}</u></b><br>NIP. ${esc(g.nip||'-')}</div></div></div>`}

/* ---------- mulai ---------- */
S.token&&S.guru?shell():viewLogin();
</script>
</body>
</html>
